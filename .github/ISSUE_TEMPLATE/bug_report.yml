name: Bug report
description: Report reproducible behaviour that differs from the documented or expected result.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do not include secrets, private data, or security vulnerabilities here. Use SECURITY.md for security reports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it is a problem.
      placeholder: I expected … but instead …
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest repeatable sequence of steps.
      placeholder: |
        1. Go to …
        2. Enter …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node/Python version, deployment context, or other relevant details.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Redact tokens, cookies, email addresses, domains, and private identifiers before attaching anything.
